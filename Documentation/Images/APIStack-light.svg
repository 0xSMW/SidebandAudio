<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">Sideband Audio integration stack</title>
<desc id="desc">Horizontal arrows connect each layer's input to its output. Vertical dashed arrows show dependencies: the optional local-file player uses the Swift PCM processor, which uses the C engine. The player supplies playback and timing in seconds. Swift and C integrations supply processed PCM and source-clock metadata for the host's output. The app owns file access, audio sessions, interruptions, and system media controls.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#667788"/></marker></defs>
