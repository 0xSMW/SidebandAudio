.heading { font-size: 18px; font-weight: 600; fill: #475569; }
.title { font-size: 25px; font-weight: 700; }
.strong { font-size: 20px; font-weight: 600; }
.body { font-size: 19px; }
.small { font-size: 17px; }
.code { font-size: 18px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.note { font-size: 17px; fill: #475569; }
</style>
